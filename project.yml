# The Xcode project is generated from this file: `xcodegen` (brew install xcodegen). Don't edit FerretMenu.xcodeproj.
name: FerretMenu
options:
  bundleIdPrefix: us.digitalempire
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    # Sparkle compares CFBundleVersion between releases: it is the marketing version.
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
    # Signed to run locally (no Apple developer team): see the README for opening a downloaded build.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Off when signed to run locally: without a team, the hardened runtime refuses the bundled Sparkle framework.
    # scripts/release.sh turns it on when it signs with a Developer ID (notarizing needs it).
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
  FerretKit:
    # Until ferret-kit is on GitHub: a checkout beside this one.
    path: ../ferret-kit
targets:
  FerretMenu:
    type: application
    platform: macOS
    sources:
      - FerretMenu
    dependencies:
      - package: FerretKit
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Ferret Menu
        PRODUCT_BUNDLE_IDENTIFIER: us.digitalempire.ferret.menu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: FerretMenu/FerretMenu.entitlements
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: FerretMenu/Info.plist
      properties:
        CFBundleDisplayName: Ferret Menu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # A menu bar app: no Dock icon, no app menu.
        LSUIElement: true
        NSHumanReadableCopyright: MIT licensed.
        NSLocalNetworkUsageDescription: Ferret Menu connects to your own Ferret server on your home network.
        # Self-hosted Ferrets are often plain HTTP on a LAN address (http://192.168.1.20:8787).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Updates (Sparkle): the latest release's feed, checked daily; updates must be signed with this key.
        SUFeedURL: https://github.com/ferret-project/ferret-menu/releases/latest/download/appcast.xml
        SUPublicEDKey: vDfxxOnE5K/LdkTy2oCt6V6Z3LFSWVF7vpKsDqew9nQ=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUVerifyUpdateBeforeExtraction: true
        # Sandboxed: Sparkle installs through its launcher service (downloads use the app's own network access).
        SUEnableInstallerLauncherService: true
    entitlements:
      path: FerretMenu/FerretMenu.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        # Sparkle's installer, reached from inside the sandbox.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
  FerretMenuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FerretMenuTests
    dependencies:
      - target: FerretMenu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Ferret Menu.app/Contents/MacOS/Ferret Menu
schemes:
  FerretMenu:
    build:
      targets:
        FerretMenu: all
        FerretMenuTests: [test]
    test:
      targets:
        - FerretMenuTests
